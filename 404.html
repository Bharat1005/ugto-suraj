<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UGTO SURAJ — Page Not Found</title>
  <link rel="canonical" href="https://ugtosuraj.com/">
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #F5EAD6;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #BF3B2C;
      text-align: center;
      box-sizing: border-box;
      padding: 1rem;
    }
    .logo {
      height: 64px;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 1.25rem;
      letter-spacing: 0.1em;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }
    p {
      color: #665048;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }
    .home-btn {
      display: inline-block;
      padding: 0.75rem 1.75rem;
      background-color: #BF3B2C;
      color: #F5EAD6;
      text-decoration: none;
      font-weight: 700;
      border-radius: 9999px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.85rem;
    }
  </style>
  <script>
    // Only redirect if visitor is on an invalid subpath, never on root
    if (window.location.pathname !== '/' && window.location.pathname !== '' && window.location.pathname !== '/index.html') {
      window.location.replace('/');
    }
  </script>
</head>
<body>
  <img src="assets/logo.svg" alt="UGTO SURAJ" class="logo">
  <h1>UGTO SURAJ</h1>
  <p>Returning to our homepage...</p>
  <a href="/" class="home-btn">Return Home</a>
</body>
</html>
